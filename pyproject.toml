[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kirara-ru"
version = "3.3.0a2"
authors = [
    { name="Lss233", email="i@lss233.com" },
]
maintainers = [
    { name="perejaslav", email="68792332+perejaslav@users.noreply.github.com" },
]
description = "Kirara RU — русскоязычный форк Kirara AI: фреймворк для AI-агентов с поддержкой Telegram, OpenAI-совместимых API и WebUI"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

license = "AGPL-3.0-only"
license-files = ["LICENSE"]

dependencies = [
    "pydantic>=2.0.0",
    "pydantic-core>=2.27.2",
    "ruamel.yaml",
    "pytest",
    "pytest-asyncio",
    "python-telegram-bot",
    "telegramify-markdown",
    "loguru",
    "aiohttp",
    "requests",
    "quart>=0.18.4",
    "quart-cors>=0.7.0",
    "fastapi>=0.110.0",
    "wechatpy",
    "pycryptodome",
    "redis[hiredis]",
    "bcrypt>=4.0.1",
    "PyJWT>=2.8.0",
    "hypercorn>=0.15.0",
    "psutil>=5.9.0",
    "setuptools",
    "tomli>=2.0.0",
    "pre-commit",
    "curl_cffi",
    "python-magic ; platform_system != 'Windows'",
    "python-magic-bin ; platform_system == 'Windows'",
    "ymbotpy",
    "Pillow",
    "pytz",
    "sqlalchemy",
    "alembic",
    "mcp>=1.0.0,<2.0.0",
    "pygls>=1.0,<2.0",
    "jedi",
    "pyflakes",
]


[project.scripts]
kirara_ai = "kirara_ai.__main__:main"

[project.urls]
"Homepage" = "https://github.com/perejaslav/kirara-ai"
"Repository" = "https://github.com/perejaslav/kirara-ai"
"Upstream" = "https://github.com/lss233/kirara-ai"
"WebUI" = "https://github.com/perejaslav/kirara-webui"
"Bug Tracker" = "https://github.com/perejaslav/kirara-ai/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["kirara_ai*"]
namespaces = true

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[options]
include_package_data = true

[tool.mypy]
disable_error_code = "override, assignment, annotation-unchecked, import-untyped"
