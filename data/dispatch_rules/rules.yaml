- rule_id: chat_normal
  name: Чат в группе
  description: В групповом чате — префикс /chat или упоминание бота
  workflow_id: chat:normal
  priority: 5
  enabled: true
  rule_groups:
  - operator: or
    rules:
    - type: prefix
      config:
        prefix: /chat
    - type: bot_mention
      config: {}
  - operator: or
    rules:
    - type: chat_type
      config:
        chat_type: 群聊
  metadata:
    category: chat
    permission: user
    temperature: 0.7
- rule_id: chat_creative
  name: Чат в личке
  description: В личных сообщениях — любое сообщение запускает диалог
  workflow_id: chat:normal
  priority: 5
  enabled: true
  rule_groups:
  - operator: or
    rules:
    - type: chat_type
      config:
        chat_type: 私聊
  metadata:
    category: chat
    permission: user
    temperature: 0.9
- rule_id: game_dice
  name: Кости
  description: Бросок костей в формате XdY (например, 2d6)
  workflow_id: game:dice
  priority: 5
  enabled: true
  rule_groups:
  - operator: or
    rules:
    - type: regex
      config:
        pattern: ^[.。]roll\s*(\d+)?d(\d+)
  metadata: {}
- rule_id: game_gacha
  name: Гача
  description: Симулятор гачи
  workflow_id: game:gacha
  priority: 5
  enabled: true
  rule_groups:
  - operator: or
    rules:
    - type: keyword
      config:
        keywords:
        - гача
        - крутка
        - "10 круток"
  metadata: {}
- rule_id: system_help
  name: Команда помощи
  description: Показать справку
  workflow_id: system:help
  priority: 10
  enabled: true
  rule_groups:
  - operator: or
    rules:
    - type: prefix
      config:
        prefix: /help
  metadata:
    category: system
    permission: user
- rule_id: system_clear_memory
  name: Очистка памяти
  description: Очистить память текущего диалога
  workflow_id: system:clear_memory
  priority: 10
  enabled: true
  rule_groups:
  - operator: or
    rules:
    - type: prefix
      config:
        prefix: /очистить
  metadata:
    category: system
    permission: user
- rule_id: fallback
  name: Правило по умолчанию
  description: Срабатывает, если не подошло ни одно правило выше.
  workflow_id: chat:memory_store
  priority: 0
  enabled: true
  rule_groups:
  - operator: or
    rules:
    - type: fallback
      config: {}
  metadata: {}
