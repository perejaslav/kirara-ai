name: Универсальный ассистент
description: Дружелюбный помощник на любые темы — отвечает кратко и по делу, помнит контекст
blocks:
  - type: internal:text_block
    name: system_prompt
    params:
      text: "Ты — Kirara RU, универсальный ассистент. Отвечай на русском, будь полезным и точным. Используй <break> для разделения длинных ответов.

# Системная информация
Текущая дата и время: {current_date_time}

# Память
-- начало истории --
{memory_content}
-- конец истории --"
    position:
      x: 426
      y: 599
    connected_to:
      - target: chat_message_constructor_wfy18q
        mapping:
          from: text
          to: system_prompt_format
  - type: internal:chat_memory_query
    name: query_memory
    params:
      scope_type: group
    position:
      x: 419
      y: 462
    connected_to:
      - target: chat_message_constructor_wfy18q
        mapping:
          from: memory_content
          to: memory_content
  - type: internal:text_block
    name: user_prompt
    params:
      text: '{user_name}说：{user_msg}'
    position:
      x: 419
      y: 317
    connected_to:
      - target: chat_message_constructor_wfy18q
        mapping:
          from: text
          to: user_prompt_format
  - type: internal:chat_message_constructor
    name: chat_message_constructor_wfy18q
    params: {}
    position:
      x: 970
      y: 346
    connected_to:
      - target: llm_chat
        mapping:
          from: llm_msg
          to: prompt
  - type: internal:get_message
    name: get_message
    params: {}
    position:
      x: 105
      y: 189
    connected_to:
      - target: toggle_edit_state_svmo3f
        mapping:
          from: sender
          to: sender
      - target: query_memory
        mapping:
          from: sender
          to: chat_sender
      - target: chat_message_constructor_wfy18q
        mapping:
          from: msg
          to: user_msg
      - target: chat_memory_store_a0fj1l
        mapping:
          from: msg
          to: user_msg
  - type: internal:llm_response_to_text
    name: c9eddb3c-113f-4a39-9d47-682d0a7dd26e
    params: {}
    position:
      x: 1658
      y: 344
    connected_to:
      - target: 6edd5c0c-a538-45ab-bb50-4c3a906bb1b1
        mapping:
          from: text
          to: text
  - type: internal:text_to_im_message
    name: 6edd5c0c-a538-45ab-bb50-4c3a906bb1b1
    params:
      split_by: <break>
    position:
      x: 1918
      y: 347
    connected_to:
      - target: msg_sender_lakgf8
        mapping:
          from: msg
          to: msg
  - type: internal:toggle_edit_state
    name: toggle_edit_state_svmo3f
    params:
      is_editing: true
    position:
      x: 424
      y: 94
  - type: internal:chat_completion
    name: llm_chat
    params:
      model_name: gemini-2.0-flash
    position:
      x: 1260
      y: 347
    connected_to:
      - target: chat_memory_store_a0fj1l
        mapping:
          from: resp
          to: llm_resp
      - target: c9eddb3c-113f-4a39-9d47-682d0a7dd26e
        mapping:
          from: resp
          to: response
  - type: internal:chat_memory_store
    name: chat_memory_store_a0fj1l
    params:
      scope_type: group
    position:
      x: 1663
      y: 192
  - type: internal:send_message
    name: msg_sender_lakgf8
    params: {}
    position:
      x: 2377
      y: 346
